# Standard MongoDB configuration for Docker
storage:
  dbPath: /data/db

net:
  port: 27017
  bindIp: 0.0.0.0

# Defense in depth: the official image also passes --auth when
# MONGO_INITDB_ROOT_USERNAME/PASSWORD are set, but enforcing it here keeps
# authentication on even if those env vars are ever removed from compose.
# (The root user is created on first volume initialization.)
security:
  authorization: enabled
